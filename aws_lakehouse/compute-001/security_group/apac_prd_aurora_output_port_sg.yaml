intake_id: M0000516
sg_name: apac_prd_aurora_output_port_sg
sg_description: Security group allowing outbound rules to egress data for ANH via Output Port Pattern.
aws_account_id: 367241115350
env: prd
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: APAC
sg_owner: soni_kumari@cargill.com
vpc_id: <VPC_ID> #Please collaborate with MIW to figure out the VPC_ID to use.
ingress_rules:
  - protocol: tcp
    from_port: 443
    to_port: 443
    source_type: cidr
    source_value: 10.0.0.0/16
    rule_description: HTTPS from internal network
egress_rules: #Note below is just an example, please don't allow all traffic outbound access since it's a data security risk
  - protocol: -1
    from_port: -1
    to_port: -1
    destination_type: cidr
    destination_value: 0.0.0.0/0
    rule_description: Allow all outbound traffic
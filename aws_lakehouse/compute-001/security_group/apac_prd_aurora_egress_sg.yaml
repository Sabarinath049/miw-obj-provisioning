intake_id: M0000516
sg_name: apac_prd_aurora_output_port_sg
sg_description: Security group allowing outbound rules to egress data for APAC via Output Port  Pattern.
aws_account_id: 367241115350
env: prd
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: APAC
sg_owner: soni_kumari@cargill.com
vpc_id: vpc-0007dd2aa38e9dca2
ingress_rules:
  - protocol: tcp
    from_port: 443
    to_port: 443
    source_type: cidr
    source_value: 10.0.0.0/16
    rule_description: HTTPS from internal network

  - protocol: "-1"
    from_port: 0
    to_port: 0
    source_type: self
    rule_description: Required AWS Glue self-referencing ingress

egress_rules:
  - protocol: tcp
    from_port: 5432
    to_port: 5432
    destination_type: cidr
    destination_value: 10.12.8.0/24
    rule_description: Allow outbound to DB subnet

  - protocol: "-1"
    from_port: 0
    to_port: 0
    destination_type: self
    rule_description: Required AWS Glue self-referencing egress

  - protocol: tcp
    from_port: 443
    to_port: 443
    destination_type: cidr
    destination_value: 0.0.0.0/0
    rule_description: Added to support runtime download of Python packages by Glue Job as requested by MEF team
intake_id: M0000516
role_name: apac_prd_procegressengineer
role_description: IAM role to serve Data Egress jobs in Compute AWS account
aws_account_id: 367241115350
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: APAC
role_owner: "soni_kumari@cargill.com"
data_env: prd
usage_type: "EgressEngineer"
compute_size: "MED"
max_session_duration: 2
access_to_resources:
    glue_databases:
        read:
          - agtr_pcpp_serving_prd
          - agtr_pcpp_curated_prd
          - agtr_dsc_qilin_curated_prd
          - agtr_dsc_qilin_serving_prd
          - agtr_china_sfdc_curated_prd
          - agtr_china_sfdc_serving_prd
          - agtr_aus_dom_curated_prd
          - agtr_aus_dom_serving_prd
    execution_asset_prefixes:
    - s3://prd-cmp1-apac-eng-assets/prd/apac/athena/
    - s3://prd-cmp1-apac-eng-assets/prd/apac/glue/
    - s3://prd-cmp1-apac-scripts/prd/apac/glue/
    glue_crawler:
    - null
enable_glue_interactive_session: true
glue_job_access_configs:
  enable_glue_jobs: true
  secret_region: "us-east-1"
  secret_name: 
  - "apac/prd/consumption/pcpp_aurora_output_port"
  - "apac/prd/consumption/dsc_aurora_output_port"
  - "apac/prd/consumption/ausctrm_aurora_output_port"
  - "apac/prd/consumption/chinasfdc_aurora_output_port"
  - "apac/prd/consumption/pcpp_sp_output_port"
  job_control_configs:
    - agtr-apac
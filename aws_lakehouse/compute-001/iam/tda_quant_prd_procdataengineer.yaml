intake_id: M0000491
role_name: tda_quant_prd_procdataengineer
role_description: IAM role for AWS Glue crawler to access S3 and Glue Data Catalog for Ag & Trading TDA_QUANT team
aws_account_id: '367241115350'
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: TDA
role_owner: "s493332"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 2
compute_size: "SML"
access_to_resources:
  glue_databases:
    write:
      - tda_quant_curated_prd
      - tda_quant_serving_analytics_prd
    read:
      - 578647603827:lh_tda_quant_raw_serving_prd_rl
      - 578647603827:lh_cdp_tda_quant_raw_prd_rl
      - 578647603827:lh_tda_quant_raw_prd_rl
  data_prefixes:
    - "s3://prd-cmp1-tda-dp/curated/prd/tda_quant/"
    - "s3://prd-cmp1-tda-dp/serving/analytics/prd/tda_quant/"

  execution_asset_prefixes:
    - s3://prd-cmp1-tda-eng-assets/prd/tda/athena/
    - s3://prd-cmp1-tda-eng-assets/prd/tda/glue/
    - s3://prd-cmp1-tda-scripts/prd/tda/glue/
  glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
  enable_athena_access: true
  athena_workgroup_name: tda_quant_prd_eng_xsml
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs:
    - agtr-tda-quant
snowflake_iceberg_support: true
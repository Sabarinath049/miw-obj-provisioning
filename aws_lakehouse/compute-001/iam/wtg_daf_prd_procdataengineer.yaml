intake_id: M0000591
role_name: wtg_daf_prd_procdataengineer
role_description: IAM role for AWS Glue crawler to access S3 and Glue Data Catalog for AGTR WTG DAF team
aws_account_id: '367241115350'
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: WTG_DAF
role_owner: "ayankesh_chakraborty@cargill.com"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 2
compute_size: "MED"
access_to_resources:
  glue_databases:
    write:
      - wtg_daf_curated_prd
      - wtg_daf_magellan_curated_prd
      - wtg_daf_magellan_serving_product_prd
      - wtg_daf_serving_product_prd
    read:
      - 578647603827:lh_agtr_magellan_raw_prd_rl
      - 578647603827:lh_agtr_daf_raw_prd_rl
      - 578647603827:lh_cdp_agtr_daf_raw_prd_rl
      - 578647603827:lh_agtr_daf_raw_serving_prd_rl
  data_prefixes:
    - s3://prd-cmp1-wtg-daf-dp/curated/prd/wtg_daf/daf/
    - s3://prd-cmp1-wtg-daf-dp/curated/prd/wtg_daf/magellan/
    - s3://prd-cmp1-wtg-daf-dp/serving/product/prd/wtg_daf/magellan/
    - s3://prd-cmp1-wtg-daf-dp/serving/product/prd/wtg_daf/daf/
  execution_asset_prefixes:
    - s3://prd-cmp1-wtg-daf-eng-assets/prd/wtg-daf/glue/
    - s3://prd-cmp1-wtg-daf-scripts/prd/wtg-daf/glue/
  glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
  enable_athena_access: false
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs:
    - agtr-wtg-daf
snowflake_iceberg_support: false

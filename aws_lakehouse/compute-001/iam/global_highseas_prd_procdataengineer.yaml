  glue_databases:
    write:
      - global_highseas_curated_prd
      - global_highseas_serving_analytics_prd
    read:
      - 578647603827:lh_global_highseas_raw_serving_prd_rl
      - 578647603827:lh_cdp_global_highseas_raw_prd_rl
      - 578647603827:lh_global_highseas_raw_prd_rl
  data_prefixes:
    - "s3://prd-cmp1-global-dp/curated/prd/global_highseas/"
    - "s3://prd-cmp1-global-dp/serving/analytics/prd/global_highseas/"

  execution_asset_prefixes:
    - s3://prd-cmp1-global-eng-assets/prd/global_highseas/athena/
    - s3://prd-cmp1-global-eng-assets/prd/global_highseas/glue/
    - s3://prd-cmp1-global-scripts/prd/global_highseas/glue/
  glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
  enable_athena_access: true
  athena_workgroup_name: global_highseas_prd_eng_xsml
glue_job_access_config:

intake_id: M0001005
role_name: global_highseas_prd_procdataengineer
role_description: IAM role for AWS Glue crawler to access S3 and Glue Data Catalog for Ag & Trading GLObal Highseas team
aws_account_id: '367241115350'
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: GLOBAL

intake_id: M0001149
role_name: global_pricehub_prd_procdataengineer
role_description: IAM role for AWS Glue crawler to access S3 and Glue Data Catalog for Ag & Trading Global team
aws_account_id: '068887784423'
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: GLOBAL
role_owner: "jonathan_cook@cargill.com"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 2
compute_size: "MED"
access_to_resources:
  glue_databases:
    write:
      - global_pricehub_curated_prd
      - global_pricehub_serving_analytics_prd
    read:
      - 438465132548:lh_cdp_pricehub_internal_raw_prd_rl
      - 438465132548:lh_cdp_pricehub_product_raw_prd_rl
      - 578647603827:lh_cdp_pricehub_upstream_raw_prd_rl
      - 578647603827:lh_pricehub_raw_serving_prd_rl
      - 578647603827:lh_cdp_tda_upstream_raw_prd_rl
  data_prefixes:
      - "s3://prd-cmp1-global-dp/curated/prd/global/pricehub/"
      - "s3://prd-cmp1-global-dp/serving/analytics/prd/global/pricehub/"
  execution_asset_prefixes:
    - s3://prd-cmp1-global-eng-assets/prd/global/athena/
    - s3://prd-cmp1-global-eng-assets/prd/global/glue/
    - s3://prd-cmp1-global-scripts/prd/global/glue/
  glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
  enable_athena_access: true
  athena_workgroup_name: agtr_global_prd_eng_xsml
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs:
    - agtr-global-pricehub
snowflake_iceberg_support: false
# Configurations for Snowflake Catalog Federation

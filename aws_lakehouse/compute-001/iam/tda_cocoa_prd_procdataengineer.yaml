intake_id: M0000485
role_name: tda_cocoa_prd_procdataengineer
role_description: IAM role for AWS Glue crawler to access S3 and Glue Data Catalog for Ag & Trading TDA_COCOA team
aws_account_id: '367241115350'
enterprise_or_func_name: AGTR
enterprise_or_func_subgrp_name: TDA
role_owner: "yueyue_wu@cargill.com"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 2
compute_size: "SML"
access_to_resources:
  glue_databases:
    write:
      - tda_cocoa_curated_prd
      - tda_cocoa_serving_prd
    read:
      - 578647603827:lh_tda_cocoa_raw_serving_prd_rl
      - 578647603827:lh_tda_cocoapp_raw_serving_prd_rl
      - 578647603827:lh_tda_qep_raw_serving_prd_rl
      - 578647603827:lh_tda_sasanalytics_raw_serving_prd_rl
      - 578647603827:lh_cocoa_minderest_raw_serving_prd_rl
      - 578647603827:lh_cdp_tda_cocoa_raw_prd_rl
      - 578647603827:lh_cdp_tda_cocoa_raw_serving_prd_rl
      - 578647603827:lh_cdp_tda_upstream_raw_prd_rl

  data_prefixes:
    - "s3://prd-cmp1-tda-dp/curated/prd/tda_cocoa/"
    - "s3://prd-cmp1-tda-dp/serving/prd/tda_cocoa/"

  execution_asset_prefixes:
    - s3://prd-cmp1-tda-eng-assets/prd/tda/athena/
    - s3://prd-cmp1-tda-eng-assets/prd/tda/glue/
    - s3://prd-cmp1-tda-scripts/prd/tda/glue/
  glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
  enable_athena_access: true
  athena_workgroup_name: tda_cocoa_prd_eng_xsml
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs:
    - agtr-tda-cocoa
snowflake_iceberg_support: true

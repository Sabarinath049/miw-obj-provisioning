intake_id: M0000969
role_name: corp_hr_prd_procdataengineer
role_description: IAM role to serve Data Engineering Use Cases in Lakehouse in production
aws_account_id: '578647603827'
enterprise_or_func_name: CORP
enterprise_or_func_subgrp_name: HR
role_owner: "kayode_dosunmu@cargill.com"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 4
compute_size: "XSML"
access_to_resources:
    glue_databases:
        write:
        - lh_genetec_raw_serving_prd
        - lh_ukg_raw_serving_prd
        read:
        - lh_cdp_genetec_raw_prd
        - lh_genetec_raw_prd
        - lh_cdp_ukg_raw_prd
        - lh_ukg_raw_prd
    data_prefixes:
    - "s3://prd-lh1-corp-hr-src/raw_serving/prd/src/genetec/"
    - "s3://prd-lh1-corp-hr-src/raw/cdp/prd/src/ukg/"
    - "s3://prd-lh1-corp-hr-src/raw/current/dev/src/ukg/"
    - "s3://prd-lh1-corp-hr-src/raw_serving/prd/src/ukg/"
    execution_asset_prefixes:
    - "s3://prd-lh1-corp-hr-eng-assets/prd/hr/athena/"
    - "s3://prd-lh1-corp-hr-eng-assets/prd/hr/glue/"
    - "s3://prd-lh1-corp-hr-scripts/prd/hr/glue/" 
    glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
    enable_athena_access: true
    athena_workgroup_name: hr_prd_eng_xsml
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs:
    - corp-hr
# Configurations for Snowflake Catalog Federation
snowflake_iceberg_support: false

intake_id: M0001139
role_name: fin_fixed_asset_prd_procdataengineer
role_description: IAM role for programmatic Data Engineer to execute DBT+GLUE jobs
aws_account_id: '632247962242'
enterprise_or_func_name: CORP
enterprise_or_func_subgrp_name: FIN
role_owner: "kevin_woelk@cargill.com"
data_env: prd
usage_type: "DataEngineer"
max_session_duration: 2
compute_size: "LRG"
access_to_resources:
    glue_databases:
        write:
        - fin_fixed_asset_prd_serving_analytics_prd
        - fin_fixed_asset_prd_curated_prd
        read:
          - fin_master_data_serving_prd
          - 578647603827:lh_jdw_raw_serving_prd_rl
          - 578647603827:lh_sap_tc1_raw_serving_prd_rl
          - 578647603827:lh_sap_tc2_raw_serving_prd_rl
          - 578647603827:lh_sap_tca_raw_serving_prd_rl
          - 578647603827:lh_sap_tcc_raw_serving_prd_rl
          - 578647603827:lh_sap_tcd_raw_serving_prd_rl
          - 578647603827:lh_sap_tce_raw_serving_prd_rl
          - 578647603827:lh_sap_tcl_raw_serving_prd_rl
    data_prefixes:
    - "s3://prd-cmp4-corp-fin-dp/curated/prd/fin/fixed_asset/"
    - "s3://prd-cmp4-corp-fin-dp/serving/prd/fin/fixed_asset/"
    execution_asset_prefixes:
    - "s3://prd-cmp4-corp-fin-eng-assets/prd/fin/athena/"
    - "s3://prd-cmp4-corp-fin-eng-assets/prd/fin/glue/"
    - "s3://prd-cmp4-corp-fin-scripts/prd/fin/glue/"
    glue_crawler:
    - null
enable_glue_interactive_session: true
athena_access_config:
    enable_athena_access: true
    athena_workgroup_name: fin_rtr_prd_eng_lrg
glue_job_access_config:
  enable_glue_jobs: true
  job_control_configs: 
    - fixed-asset
# Configurations for Snowflake Catalog Federation
snowflake_iceberg_support: false
